# Nginx custom directives for meka.starlight-coders.site
# Upload to HestiaCP File Manager:
# /home/bawantha/conf/web/meka.starlight-coders.site/nginx.ssl.conf_meka
# (Note: Do NOT include 'location /' here because HestiaCP already defines it!)

# ── MEKA IoT Hub REST API ─────────────────────────────────────────────
location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}

# ── MEKA Phone Bridge UI ──────────────────────────────────────────────
location /phone-bridge {
    proxy_pass http://127.0.0.1:5000/phone-bridge;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# ── MEKA Static Files (served by Flask) ──────────────────────────────
location /static/ {
    proxy_pass http://127.0.0.1:5000/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}

# ── MEKA WebSockets (Socket.IO) ───────────────────────────────────────
location /socket.io/ {
    proxy_pass http://127.0.0.1:5000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 7d;
    proxy_send_timeout    7d;
    proxy_read_timeout    7d;
}
