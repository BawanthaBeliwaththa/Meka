name: Build Meka

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-webapp:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        working-directory: ./Webapp
        run: |
          npm install
          npm run build

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Generate Fresh Android Project & Patch SDK
        working-directory: ./Android APP
        run: |
          rm -rf android/
          flutter create --platforms=android --project-name=meka .
          python3 -c "
          import os, re
          p = 'android/app/build.gradle'
          if os.path.exists(p):
              with open(p, 'r') as f: c = f.read()
              c = re.sub(r'flutter\.minSdkVersion', '23', c)
              c = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', c)
              with open(p, 'w') as f: f.write(c)
          "
          flutter pub get
      - name: Build APK
        working-directory: ./Android APP
        run: flutter build apk --release --no-tree-shake-icons

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Generate Windows Platform & Build
        working-directory: ./Windows APP
        run: |
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=meka_windows .
          flutter pub get
          flutter build windows --release

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install System & Audio Recording Dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libpulse-dev libasound2-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Generate Linux Platform & Build
        working-directory: ./Linux APP
        run: |
          rm -rf linux/
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --project-name=meka_linux .
          flutter pub get
          flutter build linux --release
