name: meka_desktop
description: "MEKA Super — Desktop AI Assistant for Windows & Linux"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  google_fonts: ^6.1.0

  # Networking & AI
  http: ^1.2.0
  web_socket_channel: ^2.4.0

  # Storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4

  # TTS (desktop)
  flutter_tts: ^3.8.5

  # Speech recognition
  speech_to_text: ^6.6.0

  # Firebase
  firebase_core: ^3.4.1
  firebase_database: ^11.1.2
  firebase_auth: ^5.2.1
  google_sign_in: ^6.2.1

  # Window management (Windows)
  window_manager: ^0.3.9
  local_notifier: ^0.1.6
  hotkey_manager: ^0.2.3

  # System tray
  system_tray: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
