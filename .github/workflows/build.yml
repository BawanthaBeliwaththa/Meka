name: Build Meka

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Web App ────────────────────────────────────────────────────────────────
  build-webapp:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build
        working-directory: ./Webapp
        run: |
          npm install
          npm run build

  # ─── Android APK ────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Set up Android SDK locals
        working-directory: ./Android APP
        run: |
          FLUTTER_PATH=$(dirname $(dirname $(which flutter)))
          echo "flutter.sdk=${FLUTTER_PATH}" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> android/local.properties
      - name: Flutter pub get
        working-directory: ./Android APP
        run: flutter pub get
      - name: Build APK
        working-directory: ./Android APP
        run: flutter build apk --release --no-tree-shake-icons

  # ─── Windows App ────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Enable Windows desktop & build
        working-directory: ./Windows APP
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=meka_windows .
          flutter pub get
          flutter build windows --release

  # ─── Linux App ──────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libpulse-dev libasound2-dev libspeechd-dev \
            libavcodec-dev libavformat-dev libavdevice-dev libswresample-dev \
            ffmpeg portaudio19-dev pulseaudio-utils speech-dispatcher
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Enable Linux desktop & build
        working-directory: ./Linux APP
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --project-name=meka_linux .
          flutter pub get
          flutter build linux --release