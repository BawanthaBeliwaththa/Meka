name: 🚀 Build & Release — MEKA Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.7.0)'
        required: false
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  # ── Web App Build ────────────────────────────────────────────────────────────
  build-webapp:
    name: Build Cybernetic Web App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application Bundle
        working-directory: ./Webapp
        run: |
          npm install
          npm run build
          cd dist
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          zip -r "../../MEKA-${VERSION}-Web-Dashboard.zip" .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: MEKA-*-Web-Dashboard.zip

  # ── Android APK Build ────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Android debug keystore if missing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true

      - name: Build Android Release APK
        working-directory: ./Android APP
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Artifacts
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          APK_FILE=$(find "Android APP" -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "MEKA-${VERSION}-Android-Universal.apk"
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: MEKA-*-Android-*.apk

  # ── Windows App Build ─────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Client
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        working-directory: ./Windows APP
        run: flutter pub get

      - name: Build Windows executable
        working-directory: ./Windows APP
        run: flutter build windows --release --no-tree-shake-icons

      - name: Create Portable ZIP
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "${{ github.event.inputs.version }}" }
          $releaseDir = "Windows APP\build\windows\x64\runner\Release"
          if (Test-Path $releaseDir) {
            Compress-Archive -Path "$releaseDir\*" -DestinationPath "MEKA-${version}-Windows-Portable.zip"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: MEKA-*-Windows-*.zip

  # ── Linux App Build ───────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libpulse-dev libasound2-dev libspeechd-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libswresample-dev \
            ffmpeg portaudio19-dev pulseaudio-utils speech-dispatcher dpkg-dev fakeroot

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        working-directory: ./Linux APP
        run: flutter pub get

      - name: Build Linux executable
        working-directory: ./Linux APP
        run: flutter build linux --release --no-tree-shake-icons

      - name: Package .deb and tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          PKG_VERSION="${VERSION#v}"
          PKG_DIR="meka-deb-pkg"
          BUNDLE_DIR="Linux APP/build/linux/x64/release/bundle"

          if [ -d "$BUNDLE_DIR" ]; then
            mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/lib/meka" \
                     "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/share/applications"

            cp -r "${BUNDLE_DIR}/"* "${PKG_DIR}/usr/lib/meka/"
            ln -sf /usr/lib/meka/meka_linux "${PKG_DIR}/usr/bin/meka"

            printf "[Desktop Entry]\nType=Application\nName=MEKA\nComment=MEKA Smart Home AI Assistant\nExec=/usr/lib/meka/meka_linux\nIcon=utility\nTerminal=false\nCategories=Utility;Network;\n" > "${PKG_DIR}/usr/share/applications/meka.desktop"
            printf "Package: meka\nVersion: ${PKG_VERSION}\nArchitecture: amd64\nMaintainer: Project MEKA <hello@project-meka.dev>\nDepends: libgtk-3-0\nSection: utils\nPriority: optional\nDescription: MEKA AI Personal Assistant & Smart Home Controller\n" > "${PKG_DIR}/DEBIAN/control"

            dpkg-deb --build "${PKG_DIR}" "MEKA-${VERSION}-Linux-amd64.deb"

            TAR_DIR="MEKA-${VERSION}-Linux"
            mkdir -p "${TAR_DIR}"
            cp -r "${BUNDLE_DIR}/"* "${TAR_DIR}/"
            tar -czf "${TAR_DIR}.tar.gz" "${TAR_DIR}/"
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            MEKA-*-Linux-*.deb
            MEKA-*-Linux.tar.gz

  # ── Unified GitHub Release ───────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    if: always() && !cancelled()
    needs: [build-webapp, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🤖 MEKA ${{ github.ref_name }} — Universal Multi-Platform Release"
          body: |
            # 🚀 MEKA ${{ github.ref_name }} — Multi-Platform Release

            Welcome to the official release of **MEKA** across all supported platforms!

            ---

            ### 🌐 Web Dashboard & Cybernetic App
            - `MEKA-${{ github.ref_name }}-Web-Dashboard.zip`

            ### 📱 Android Mobile Client
            - `MEKA-${{ github.ref_name }}-Android-Universal.apk`

            ### 🖥️ Windows Desktop Client
            - `MEKA-${{ github.ref_name }}-Windows-Portable.zip`

            ### 🐧 Linux Desktop Client
            - `MEKA-${{ github.ref_name }}-Linux-amd64.deb`
            - `MEKA-${{ github.ref_name }}-Linux.tar.gz`
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
