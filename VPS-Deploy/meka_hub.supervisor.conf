# VPS Supervisor configuration for MEKA IoT Hub
# Upload this to /etc/supervisor/conf.d/meka_hub.conf on your VPS

[program:meka_hub]
command=python3 /home/bawantha/web/meka.starlight-coders.site/public_html/backend/hub_server.py
directory=/home/bawantha/web/meka.starlight-coders.site/public_html/backend
autostart=true
autorestart=true
stderr_logfile=/var/log/meka_hub.err.log
stdout_logfile=/var/log/meka_hub.out.log
environment=PYTHONUNBUFFERED=1
user=www-data
startretries=5
startsecs=3
