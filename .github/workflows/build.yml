name: Build Meka

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Install Dependencies & Pub Get
        working-directory: ./Android APP
        run: flutter pub get
      - name: Build APK
        working-directory: ./Android APP
        run: flutter build apk --release --no-tree-shake-icons

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Generate Windows Platform & Pub Get
        working-directory: ./Windows APP
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=meka_windows .
          flutter pub get
      - name: Build Windows
        working-directory: ./Windows APP
        run: flutter build windows --release

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Generate Linux Platform & Pub Get
        working-directory: ./Linux APP
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --project-name=meka_linux .
          flutter pub get
      - name: Build Linux
        working-directory: ./Linux APP
        run: flutter build linux --release
