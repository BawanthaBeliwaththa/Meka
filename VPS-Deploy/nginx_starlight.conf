# Nginx Reverse Proxy Config for MEKA on https://starlight-coders.site/Meka
# Paste this block into your VPS Nginx server block for starlight-coders.site

# 1. MEKA WebApp Static Frontend (Upload built 'dist' files to /var/www/meka)
location /Meka {
    alias /var/www/meka;
    index index.html;
    try_files $uri $uri/ /Meka/index.html;
}

# 2. MEKA IoT Hub REST API
location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# 3. MEKA Phone Bridge Interface
location /phone-bridge {
    proxy_pass http://127.0.0.1:5000/phone-bridge;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# 4. MEKA WebSockets (Socket.IO for audio & camera streaming)
location /socket.io/ {
    proxy_pass http://127.0.0.1:5000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
