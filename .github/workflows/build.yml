name: Build & Package Meka Multi-Platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ─── Web App ────────────────────────────────────────────────────────────────
  build-webapp:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./Webapp
        run: npm install
      - name: Build web application
        working-directory: ./Webapp
        run: npm run build
      - name: Archive Web App
        run: |
          cd Webapp/dist
          zip -r ../../MEKA-Web-Dashboard.zip .
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meka-web-dashboard
          path: MEKA-Web-Dashboard.zip

  # ─── Android APK ────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Generate Android debug keystore if missing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keysize 2048 -validity 10000 || true
      - name: Flutter pub get
        working-directory: ./Android APP
        run: flutter pub get
      - name: Build Universal & Split APKs
        working-directory: ./Android APP
        run: |
          flutter build apk --release --no-tree-shake-icons -v > build.log 2>&1 || (echo "### Android Build Failed" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat build.log | tail -n 80 && exit 1)
      - name: Prepare APK Artifacts
        run: |
          mv "Android APP/build/app/outputs/flutter-apk/app-release.apk" "MEKA-Android-Universal.apk" || true
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meka-android-apks
          path: MEKA-Android-*.apk

  # ─── Windows App ────────────────────────────────────────────────────
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Flutter pub get
        working-directory: ./Windows APP
        run: flutter pub get
      - name: Build Windows executable
        working-directory: ./Windows APP
        run: |
          $output = flutter build windows --release --no-tree-shake-icons -v 2>&1
          if ($LASTEXITCODE -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Build Failed`n``````n$($output | Select-Object -Last 80 | Out-String)``````n"
            Write-Host ($output | Select-Object -Last 80 | Out-String)
            exit 1
          }
      - name: Package Windows ZIP
        run: |
          $releaseDir = "Windows APP\build\windows\x64\runner\Release"
          if (Test-Path $releaseDir) {
            Compress-Archive -Path "$releaseDir\*" -DestinationPath "MEKA-Windows-Portable.zip"
          }
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meka-windows-app
          path: MEKA-Windows-Portable.zip

  # ─── Linux App ──────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux App
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            libpulse-dev libasound2-dev libspeechd-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev libswresample-dev \
            ffmpeg portaudio19-dev pulseaudio-utils speech-dispatcher dpkg-dev fakeroot
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Flutter pub get
        working-directory: ./Linux APP
        run: flutter pub get
      - name: Build Linux executable
        working-directory: ./Linux APP
        run: |
          flutter build linux --release --no-tree-shake-icons -v > build.log 2>&1 || (echo "### Linux Build Failed" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat build.log | tail -n 80 && exit 1)
      - name: Package .deb and tar.gz
        run: |
          PKG_DIR="meka-deb-pkg"
          BUNDLE_DIR="Linux APP/build/linux/x64/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/lib/meka" "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/share/applications"
            cp -r "${BUNDLE_DIR}/"* "${PKG_DIR}/usr/lib/meka/"
            ln -sf /usr/lib/meka/meka_linux "${PKG_DIR}/usr/bin/meka"
            printf "[Desktop Entry]\nType=Application\nName=MEKA\nComment=MEKA Smart Home AI Assistant\nExec=/usr/lib/meka/meka_linux\nIcon=utility\nTerminal=false\nCategories=Utility;Network;\n" > "${PKG_DIR}/usr/share/applications/meka.desktop"
            printf "Package: meka\nVersion: 3.0.0\nArchitecture: amd64\nMaintainer: Project MEKA <hello@project-meka.dev>\nDepends: libgtk-3-0\nSection: utils\nPriority: optional\nDescription: MEKA AI Personal Assistant & Smart Home Controller\n" > "${PKG_DIR}/DEBIAN/control"
            dpkg-deb --build "${PKG_DIR}" "MEKA-Linux-amd64.deb"
            mkdir -p MEKA-Linux-Portable
            cp -r "${BUNDLE_DIR}/"* MEKA-Linux-Portable/
            tar -czf "MEKA-Linux-Portable.tar.gz" MEKA-Linux-Portable/
          fi
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meka-linux-app
          path: |
            MEKA-Linux-amd64.deb
            MEKA-Linux-Portable.tar.gz