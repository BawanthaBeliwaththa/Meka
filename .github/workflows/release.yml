name: 🚀 Build & Release — MEKA Multi-Platform (Android, Windows, Linux, Web)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Web App & Cybernetic Dashboard Build ───────────────────────────────────
  build-webapp:
    name: Build Cybernetic Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application Bundle
        working-directory: ./Webapp
        run: |
          npm install
          npm run build
          cd dist
          zip -r "../../MEKA-${GITHUB_REF_NAME}-Web-Dashboard.zip" .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: MEKA-*-Web-Dashboard.zip

  # ── Android APK Build ───────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./Android APP
        run: flutter pub get

      - name: Build Universal & Split APKs
        working-directory: ./Android APP
        run: |
          flutter build apk --release --no-tree-shake-icons --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}
          flutter build apk --release --split-per-abi --no-tree-shake-icons --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}

      - name: Prepare APK Artifacts
        run: |
          VERSION=${GITHUB_REF_NAME}
          mv "Android APP/build/app/outputs/flutter-apk/app-release.apk" "MEKA-${VERSION}-Android-Universal.apk" || true
          mv "Android APP/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "MEKA-${VERSION}-Android-arm64.apk" || true
          mv "Android APP/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "MEKA-${VERSION}-Android-arm32.apk" || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: MEKA-*-Android-*.apk

  # ── Windows App Build ──────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Client
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Windows Platform & Install dependencies
        working-directory: ./Windows APP
        run: |
          if (Test-Path "windows") { Remove-Item -Recurse -Force "windows" }
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name=meka_windows .
          flutter pub get

      - name: Build Windows Release
        working-directory: ./Windows APP
        run: flutter build windows --release --build-name=${{ github.ref_name }} --build-number=${{ github.run_number }}

      - name: Create Portable ZIP
        run: |
          $version = "${{ github.ref_name }}"
          if (Test-Path "Windows APP\build\windows\x64\runner\Release") {
            Compress-Archive -Path "Windows APP\build\windows\x64\runner\Release\*" -DestinationPath "MEKA-${version}-Windows-Portable.zip"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: MEKA-*-Windows-*

  # ── Linux App Build ────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Client
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev \
            dpkg-dev fakeroot

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop & Generate Platform
        working-directory: ./Linux APP
        run: |
          rm -rf linux/
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --project-name=meka_linux .
          flutter pub get

      - name: Build Linux Release
        working-directory: ./Linux APP
        run: flutter build linux --release --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}

      - name: Package .deb and tar.gz
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG_DIR=meka-deb-pkg

          if [ -d "Linux APP/build/linux/x64/release/bundle/" ]; then
            mkdir -p ${PKG_DIR}/DEBIAN ${PKG_DIR}/usr/lib/meka ${PKG_DIR}/usr/bin ${PKG_DIR}/usr/share/applications

            cp -r "Linux APP/build/linux/x64/release/bundle/"* ${PKG_DIR}/usr/lib/meka/
            ln -sf /usr/lib/meka/meka_linux ${PKG_DIR}/usr/bin/meka

            cat > ${PKG_DIR}/usr/share/applications/meka.desktop << 'EOF'
[Desktop Entry]
Type=Application
Name=MEKA
Comment=MEKA Smart Home AI Assistant
Exec=/usr/lib/meka/meka_linux
Icon=utility
Terminal=false
Categories=Utility;Network;
EOF

            cat > ${PKG_DIR}/DEBIAN/control << EOF
Package: meka
Version: ${VERSION}
Architecture: amd64
Maintainer: Project MEKA <hello@project-meka.dev>
Depends: libgtk-3-0
Section: utils
Priority: optional
Description: MEKA AI Personal Assistant & Smart Home Controller
EOF

            dpkg-deb --build ${PKG_DIR} "MEKA-${GITHUB_REF_NAME}-Linux-amd64.deb"

            # Portable tarball
            TAR_DIR="MEKA-${GITHUB_REF_NAME}-Linux"
            mkdir -p ${TAR_DIR}
            cp -r "Linux APP/build/linux/x64/release/bundle/"* ${TAR_DIR}/
            tar -czf "${TAR_DIR}.tar.gz" ${TAR_DIR}/
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            MEKA-*-Linux-*.deb
            MEKA-*-Linux.tar.gz

  # ── Unified GitHub Release ──────────────────────────────────────────────────
  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-webapp, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🤖 MEKA ${{ github.ref_name }} — Universal Multi-Platform Release"
          body: |
            # 🚀 MEKA ${{ github.ref_name }} — Multi-Platform Release

            Welcome to the official release of **MEKA** (Master Electronic Kinetic Assistant) across all supported platforms!

            ---

            ### 🌐 Web Dashboard & Cybernetic App
            | Package | Description | Recommended? |
            |---------|-------------|:---:|
            | `MEKA-${{ github.ref_name }}-Web-Dashboard.zip` | Web App static bundle (Host on Vercel, Netlify, or local NGINX) | ✅ |

            ---

            ### 📱 Android Mobile Client
            | Package | Description | Recommended? |
            |---------|-------------|:---:|
            | `MEKA-${{ github.ref_name }}-Android-Universal.apk` | Universal APK for all Android devices (Android 7.0+) | ✅ |
            | `MEKA-${{ github.ref_name }}-Android-arm64.apk` | 64-bit ARM devices only | ⚡ |
            | `MEKA-${{ github.ref_name }}-Android-arm32.apk` | 32-bit legacy ARM devices | |

            ---

            ### 🖥️ Windows Desktop Client
            | Package | Description | Recommended? |
            |---------|-------------|:---:|
            | `MEKA-${{ github.ref_name }}-Windows-Portable.zip` | Portable ZIP (Extract and run without installing) | ⚡ |

            ---

            ### 🐧 Linux Desktop Client
            | Package | Description | Recommended? |
            |---------|-------------|:---:|
            | `MEKA-${{ github.ref_name }}-Linux-amd64.deb` | Debian / Ubuntu / Linux Mint package | ✅ |
            | `MEKA-${{ github.ref_name }}-Linux.tar.gz` | Universal Linux Portable tarball | ⚡ |

            ---

            ### ⚡ Quick Start
            1. Download the package for your platform above.
            2. Launch MEKA and connect to your **MEKA IoT Hub** (local IP or cloud VPS URL).
            3. Monitor ESP32 hardware nodes, control smart home devices, and use voice AI assistant features!

            ---
            *Project MEKA — Open Source Smart Home AI Assistant*
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
